summary: test the 'go' project

execute: |
  docker run --rm -v $(pwd):/workdir go:1.26-26.04 \
    exec go run /workdir/hello/cmd/hello/main.go | grep "Hello, World!"

  docker run --rm -v $(pwd):/workdir go:1.26-26.04 \
    exec go -C /workdir/hello test

  docker run --rm -v $(pwd):/workdir -e CGO_ENABLED=1 go:1.26-26.04 \
    exec go run /workdir/hello/cmd/hello_cgo/main_cgo.go | grep "Hello from C!"

  apt update && apt install git -y
  git clone https://github.com/canonical/chisel
  cd chisel && git checkout v1.4.1
  docker run --rm -v $(pwd):/workdir go:1.26-26.04 \
    exec go -C /workdir build ./cmd/chisel
  ./chisel
